<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="When In Rome">
    <meta name="theme-color" content="#e7dcc6">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="preload" href="fonts/hanken-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <title>When In Rome</title>
    <style>
        @font-face { font-family: "Hanken Grotesk"; font-weight: 400; font-display: swap; src: url(fonts/hanken-400.ttf) format("truetype"); }
        @font-face { font-family: "Hanken Grotesk"; font-weight: 500; font-display: swap; src: url(fonts/hanken-500.ttf) format("truetype"); }
        @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-display: swap; src: url(fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); }
        @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-display: swap; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }

        /* Travertine and terracotta: warm stone for the page, cut tablets of paper, one terracotta for actions. */
        :root {
            --bg: #e7dcc6; --surface: #dacbaf; --paper: #f5eee0; --rule: #d9cbb0;
            --ink: #2b211b; --muted: #65564a;
            --accent: #9c3d26; --accent-ink: #fff;
            --field: #4a2a1d; --field-ink: #f5eee0;
            --serif: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
            --radius: 10px; --gutter: 16px;
            --step-small: .875rem; --step-body: 1.0625rem; --step-lead: 1.375rem;
            --step-phrase: 1.75rem;
            --step-head: clamp(2.6rem, 1.7rem + 4vw, 3.9rem);
            --step-hero: clamp(3.6rem, 2.2rem + 7vw, 5.8rem);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1613; --surface: #2d241f; --paper: #362b25; --rule: #4a3c33;
                --ink: #f0e6d5; --muted: #bfae98;
                --accent: #e2906a; --accent-ink: #26120a;
                --field: #4a2a1d; --field-ink: #f5eee0;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--step-body)/1.45 "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -.005em; }
        button { font: inherit; letter-spacing: inherit; color: inherit; }
        svg { display: block; flex: none; }
        :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

        main { max-width: 560px; margin: 0 auto; padding: calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) calc(112px + env(safe-area-inset-bottom)); }

        /* Type: a carved serif for Italian and headings, a plain sans for everything you read in English. */
        h1 { font-family: var(--serif); font-weight: 600; font-size: var(--step-hero); line-height: .92; letter-spacing: -.02em; margin: 0; text-wrap: balance; font-variant-numeric: lining-nums; }
        h2 { font-weight: 500; font-size: var(--step-small); line-height: 1.2; letter-spacing: .14em; text-transform: uppercase; margin: 0; display: flex; align-items: baseline; gap: 12px; color: var(--muted); }
        h2 .sec { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; letter-spacing: .04em; color: var(--accent); text-transform: none; }
        p { margin: 0; }
        .lead { font-size: var(--step-lead); line-height: 1.25; letter-spacing: -.015em; }
        .small { font-size: var(--step-small); color: var(--muted); }
        .kicker { font-size: var(--step-small); font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }

        /* Tablets: paper laid on stone. The first one is an arch. */
        .slip { background: var(--paper); border-radius: var(--radius); padding: 26px 22px 12px; margin-bottom: 14px; }
        .hero { border-radius: 999px 999px var(--radius) var(--radius); padding: 72px 26px 30px; text-align: center; }
        .hero h1 { margin: 0 auto; }
        .hero p.lead { margin: 20px auto 0; max-width: 23ch; color: var(--muted); }
        .numeral { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .numeral .rn { font-family: var(--serif); font-weight: 600; font-size: 2.6rem; line-height: 1; letter-spacing: .14em; color: var(--accent); padding: 10px 4px 6px 18px; border-block: 2px solid var(--rule); }
        .numeral .rn .of { color: var(--muted); font-size: .6em; letter-spacing: .1em; }
        .viewhead { padding: 8px 6px 24px; }
        .viewhead h1 { font-size: var(--step-head); }
        .viewhead .small { margin-top: 10px; font-size: var(--step-body); }

        .slip h2 { margin-bottom: 6px; }
        .rows { list-style: none; margin: 0; padding: 0; }
        .row { display: flex; align-items: center; gap: 10px; padding: 18px 0; border-top: 1px solid var(--rule); animation: rise .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
        .row:first-child { border-top: 0; }
        .row .txt { flex: 1; min-width: 0; }
        .cz { font-family: var(--serif); font-weight: 600; font-size: var(--step-phrase); line-height: 1.08; letter-spacing: -.01em; }
        .snd { color: var(--accent); font-size: var(--step-small); font-weight: 500; margin-top: 4px; }
        .en { color: var(--muted); font-size: var(--step-small); margin-top: 1px; }

        /* Buttons: one shape. */
        .ib { flex: none; width: 48px; height: 48px; border-radius: var(--radius); border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: transform .12s; }
        .ib.say { background: var(--accent); color: var(--accent-ink); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--radius); background: var(--surface); color: var(--ink); min-height: 52px; padding: 0 20px; font-weight: 500; cursor: pointer; transition: transform .12s; }
        .btn.primary { background: var(--accent); color: var(--accent-ink); }
        .ib:active, .btn:active, .opt:active { transform: scale(.95); }
        .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
        .btns .btn { flex: 1 1 auto; }

        /* The tip at the end: a block of dark umber. */
        .field { background: var(--field); color: var(--field-ink); padding: 32px 24px 36px; margin: 8px 0 0; border-radius: var(--radius); }
        .field p { font-size: var(--step-lead); line-height: 1.3; letter-spacing: -.015em; max-width: 28ch; }
        .field .first { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; line-height: 1.1; display: block; margin-bottom: 8px; letter-spacing: 0; }

        /* Flashcard: a two-sided card that turns over. */
        .scene { perspective: 1400px; margin-bottom: 8px; animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
        .card { display: grid; width: 100%; min-height: 340px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,.2,.2,1); }
        .card.flipped { transform: rotateY(180deg); }
        .card .face { grid-area: 1 / 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; background: var(--paper); border-radius: var(--radius); border-top: 6px solid var(--accent); padding: 28px 24px 40px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .card .face.back { transform: rotateY(180deg); border-top-color: var(--ink); }
        .card .big { font-family: var(--serif); font-weight: 600; font-size: var(--step-head); line-height: 1; letter-spacing: -.015em; }
        .card .front .big { font-family: inherit; font-weight: 500; font-size: clamp(1.9rem, 1.4rem + 2.4vw, 2.6rem); line-height: 1.1; letter-spacing: -.03em; }
        .card .snd { font-size: var(--step-lead); margin-top: 6px; }
        .card .hint { margin-top: 18px; }

        /* Quiz */
        .q { font-family: inherit; font-weight: 500; font-size: clamp(2rem, 1.4rem + 3vw, 2.9rem); line-height: 1.04; letter-spacing: -.035em; margin: 0 0 22px; padding: 0 6px; }
        .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 64px; text-align: left; border: 0; border-radius: var(--radius); background: var(--paper); color: var(--ink); font-family: var(--serif); font-weight: 600; font-size: 1.6rem; line-height: 1.1; padding: 12px 18px; margin: 0 0 8px; cursor: pointer; transition: transform .12s; }
        .opt.right { background: var(--accent); color: var(--accent-ink); }
        .opt.wrong { background: var(--ink); color: var(--bg); }
        .opt:disabled { cursor: default; }
        .opt:disabled:not(.right):not(.wrong) { opacity: .55; }
        .progress { padding: 0 6px 12px; }
        .result { text-align: center; padding: 34px 22px 30px; }
        .result .numeral { margin: 0 0 22px; }
        .result .numeral .rn { font-size: 3.4rem; }
        .result .lead { margin: 14px auto 0; max-width: 24ch; color: var(--muted); }

        /* Tab bar */
        nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); padding: 8px var(--gutter) calc(8px + env(safe-area-inset-bottom)); }
        nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface); border-radius: calc(var(--radius) + 4px); padding: 6px; }
        nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; border-radius: var(--radius); padding: 9px 0 7px; font-size: var(--step-small); font-weight: 500; color: var(--muted); cursor: pointer; transition: transform .12s; }
        nav.tabs button:active { transform: scale(.95); }
        nav.tabs button[aria-current="true"] { background: var(--ink); color: var(--bg); }

        /* Full-screen phrase: the tablet you hold up to the waiter. Always light, for legibility. */
        .overlay { position: fixed; inset: 0; z-index: 50; background: #f5eee0; color: #2b211b; display: none; flex-direction: column; height: 100dvh; }
        .overlay.on { display: flex; }
        .overlay .top { height: 12px; background: #9c3d26; flex: none; }
        .overlay .bar { display: flex; gap: 8px; justify-content: flex-end; padding: max(12px, env(safe-area-inset-top)) 16px 8px; flex: none; }
        .overlay .bar .btn { background: #e7dcc6; color: #2b211b; min-height: 48px; padding: 0 16px; }
        .overlay .body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; padding: 16px 24px 40px; transition: transform .3s; }
        .overlay .body.flip { transform: rotate(180deg); }
        .ov-cz { font-family: var(--serif); font-weight: 600; font-size: clamp(3rem, 15vw, 6.2rem); line-height: .98; letter-spacing: -.01em; overflow-wrap: break-word; }
        .ov-sub { margin-top: 24px; font-size: clamp(1.25rem, 5vw, 1.75rem); color: #8a3520; font-weight: 500; letter-spacing: -.015em; }
        .ov-en { margin-top: 8px; font-size: clamp(1.0625rem, 4vw, 1.375rem); color: #65564a; }
        #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--radius); font-size: var(--step-small); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
        #toast.on { opacity: 1; }

        .speaking { outline: 3px solid var(--accent); outline-offset: 2px; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .row, .scene { animation: none; }
            .card { transition: none; }
            * { transition: none !important; }
        }
        @media (min-width: 700px) { main { padding-top: 48px; } .slip { padding: 30px 32px 14px; } .hero { padding: 96px 40px 36px; } .field { padding: 40px 32px; } }
    </style>
</head>
<body class="notranslate" translate="no">
    <main id="main"></main>

    <nav class="tabs" aria-label="Sections">
        <div class="in">
            <button type="button" data-tab="phrases"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/></svg>Phrases</button>
            <button type="button" data-tab="cards"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h13v11H3zM8 5h13v11"/></svg>Cards</button>
            <button type="button" data-tab="quiz"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Quiz</button>
            <button type="button" id="speed" aria-pressed="false" aria-label="Speech speed"></button>
        </div>
    </nav>

    <!-- Full-screen phrase, for showing someone -->
    <div id="ov-phrase" class="overlay" role="dialog" aria-modal="true" aria-label="Phrase, full screen">
        <div class="top"></div>
        <div class="bar">
            <button type="button" class="btn" id="ov-say"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="9" width="3.4" height="6" rx="1.7"/><rect x="7.2" y="4" width="3.4" height="16" rx="1.7"/><rect x="12.4" y="7" width="3.4" height="10" rx="1.7"/><rect x="17.6" y="10" width="3.4" height="4" rx="1.7"/></svg>Say it</button>
            <button type="button" class="btn" data-flip><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"/></svg>Turn round</button>
            <button type="button" class="btn" data-close>Close</button>
        </div>
        <div class="body" data-body>
            <div class="ov-cz" id="ov-cz" lang="it"></div>
            <div class="ov-sub" id="ov-sound"></div>
            <div class="ov-en" id="ov-en"></div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="data.js?v=1"></script>
    <script src="app.js?v=1"></script>
</body>
</html>
